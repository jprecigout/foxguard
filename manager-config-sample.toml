# Configuration de foxguard-manager (à copier en `manager-config.toml`).
#
# Le manager tourne sur le serveur annexe : il s'abonne au broker MQTT sur
# lequel les caméras publient, et expose leur historique par HTTP.

[server]
host = "0.0.0.0"
port = 8090
# Dossier statique servi à la racine : le bundle produit par `ui/`.
# Tant que l'interface React n'existe pas, ce dossier est absent et seules
# les routes /api/* répondent.
ui_dir = "ui/dist"

# SEULE SECTION OBLIGATOIRE : sans broker, le manager n'a rien à agréger.
[mqtt]
broker_host = "mosquitto"
broker_port = 1883
# Identifiants optionnels : laisser vide si le broker n'exige pas
# d'authentification.
username = ""
password = ""
# Doit correspondre au `topic` configuré sur les caméras. Un motif comme
# "foxguard/+/detections" permet d'écouter plusieurs topics à la fois.
topic = "foxguard/detections"

# SECTION OBLIGATOIRE : sans base, le manager perdrait silencieusement tout ce
# qu'il reçoit et refuse donc de démarrer.
#
# Les migrations du schéma sont appliquées automatiquement au démarrage : il
# n'y a rien à préparer à la main, ni à la première installation ni après une
# mise à jour.
[database]
# URL de connexion. Peut être laissée VIDE ici et fournie par la variable
# d'environnement DATABASE_URL, qui prend alors le pas : c'est la forme
# habituelle en conteneur, et elle évite d'écrire un mot de passe dans un
# fichier (voir deploy/server/compose.yml).
url = "postgres://foxguard:motdepasse@postgres:5432/foxguard"
# Taille maximale du pool de connexions.
max_connections = 5
# Durée de conservation des événements, en jours. Une tâche de fond supprime
# les plus anciens, une fois par jour et au démarrage.
#
# 0 DÉSACTIVE la purge : aucun événement n'est alors jamais effacé.
retention_days = 90
