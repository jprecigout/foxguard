[package]
name = "foxguard-manager"
version = "0.1.0"
edition = "2024"
description = "Agrège les événements de détection de plusieurs caméras FoxGuard"

# Déployé sur un SERVEUR ANNEXE, pas sur le Raspberry Pi : aucune dépendance
# caméra ici (ni V4L2, ni ONNX, ni traitement d'image). C'est ce qui permet de
# construire son image sans jamais passer par la compilation croisée ARM64.
[dependencies]
foxguard-protocol = { workspace = true, features = ["ts"] }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
ts-rs = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
# `compression-gzip` : les réponses JSON d'une journée se compressent très
# bien (voir `create_router`). Activée ICI et non dans le workspace : la
# caméra ne la compile pas.
tower-http = { workspace = true, features = ["compression-gzip"] }
# Hachage des mots de passe de l'interface (voir `src/auth.rs`). Argon2id :
# le standard actuel, conçu pour rendre coûteuse une attaque par
# dictionnaire si la configuration fuit. Pur Rust (RustCrypto), et compilé
# pour le seul manager.
argon2 = "0.5"
base64 = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
sqlx = { workspace = true }
# Utilisés uniquement par `tests/api_postgres.rs` : appel du routeur Axum sans
# ouvrir de socket réseau (tower::ServiceExt::oneshot) et lecture des corps de
# réponse HTTP. Mêmes outils que côté caméra, pour la même raison.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
