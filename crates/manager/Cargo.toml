[package]
name = "foxguard-manager"
version = "0.1.0"
edition = "2024"
description = "Agrège les événements de détection de plusieurs caméras FoxGuard"

# Déployé sur un SERVEUR ANNEXE, pas sur le Raspberry Pi : aucune dépendance
# caméra ici (ni V4L2, ni ONNX, ni traitement d'image). C'est ce qui permet de
# construire son image sans jamais passer par la compilation croisée ARM64.
[dependencies]
foxguard-protocol = { workspace = true, features = ["ts"] }

anyhow = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
rumqttc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
ts-rs = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3.14"
sqlx = { workspace = true }
# Utilisés uniquement par `tests/api_postgres.rs` : appel du routeur Axum sans
# ouvrir de socket réseau (tower::ServiceExt::oneshot) et lecture des corps de
# réponse HTTP. Mêmes outils que côté caméra, pour la même raison.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
