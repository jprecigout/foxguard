[package]
name = "foxguard-camera"
version = "0.1.0"
edition = "2024"

[dependencies]

# Web & Asynchronisme
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true }
rayon = "1.10"

# Traitement image & V4L2
v4l = "0.14"
image = "0.25"
imageproc = "0.25"
font8x8 = "0.3"

# IA / ONNX Runtime
tract-onnx = "0.23.4"
ndarray = "0.17.2"

# Utilitaire & Alertes
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-native-tls",
] }
chrono = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { version = "0.7.19", features = ["io"] }
# Client MQTT (publication des événements de détection, voir src/mqtt.rs).
# `default-features = false` : la connexion au broker n'utilise pas TLS
# (voir `[mqtt]` dans config.toml), donc on désactive le backend TLS par
# défaut de rumqttc ("use-rustls") pour éviter de tirer `rustls`/`ring` en
# dépendance — `ring` embarque de l'assembleur par architecture qui a déjà
# fait planter la compilation croisée ARM64 sous QEMU (voir le Dockerfile,
# lettre/tokio1-native-tls pour le même problème côté e-mail).
rumqttc = { workspace = true }

[dev-dependencies]
# Utilisés uniquement par les tests unitaires/d'intégration (voir tests/ et
# les modules #[cfg(test)]) : appel du routeur Axum sans ouvrir de socket
# réseau (tower::ServiceExt::oneshot), lecture des corps de réponse HTTP, et
# fichiers/dossiers temporaires isolés entre les tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.14"
