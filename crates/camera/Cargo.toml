[package]
name = "foxguard-camera"
version = "0.1.0"
edition = "2024"

[dependencies]

# Contrat de messages partagé avec foxguard-manager : c'est ce crate qui
# garantit que le JSON publié ici est exactement celui que le manager relit.
foxguard-protocol = { workspace = true }

# Web & Asynchronisme
tokio = { workspace = true }
axum = { workspace = true, features = ["ws"] }
futures-util = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tower-http = { workspace = true, features = ["fs"] }
# `ServiceExt::oneshot`, pour déléguer le service d'un fichier
# d'enregistrement à `tower_http::services::ServeFile` (voir src/api.rs).
# Déjà présent dans le graphe de dépendances via axum : aucun coût de
# compilation supplémentaire.
tower = { version = "0.5", features = ["util"] }
rayon = "1.10"

# Traitement image & V4L2
v4l = "0.14"
image = "0.25"
imageproc = "0.25"
font8x8 = "0.3"

# IA / ONNX Runtime
tract-onnx = "0.23.4"
ndarray = "0.17.2"

# Encodage H.264 du flux caméra (voir src/h264/ et src/rtsp/).
#
# `default-features = false` + `source` : on construit l'implémentation Cisco
# depuis ses sources vendues avec le crate, plutôt que de charger une
# bibliothèque partagée à l'exécution (`libloading`) qui n'existe pas dans
# l'image Debian slim du Raspberry Pi.
#
# Contrairement à `ring` et `native-tls` (voir les notes ci-dessous), ce crate
# ne pose PAS de problème en compilation croisée ARM64 : son script de
# compilation ne cherche d'assembleur que pour x86/x86_64, et construit du C++
# portable pour tout le reste. `OPENH264_NO_ASM=1` le désactive même sur x86,
# si besoin.
openh264 = { version = "0.9", default-features = false, features = ["source"] }

# Utilitaire & Alertes
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-native-tls",
] }
chrono = { workspace = true }
anyhow = { workspace = true }
# Encodage des jeux de paramètres H.264 dans le SDP (voir src/rtsp/sdp.rs) et
# des vignettes de détection (via foxguard-protocol).
base64 = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio-util = { version = "0.7.19", features = ["io"] }
# Client MQTT (publication des événements de détection, voir src/mqtt.rs).
# `default-features = false` : la connexion au broker n'utilise pas TLS
# (voir `[mqtt]` dans camera-config.toml), donc on désactive le backend TLS par
# défaut de rumqttc ("use-rustls") pour éviter de tirer `rustls`/`ring` en
# dépendance — `ring` embarque de l'assembleur par architecture qui a déjà
# fait planter la compilation croisée ARM64 sous QEMU (voir le Dockerfile,
# lettre/tokio1-native-tls pour le même problème côté e-mail).
rumqttc = { workspace = true }

[dev-dependencies]
# Utilisés uniquement par les tests unitaires/d'intégration (voir tests/ et
# les modules #[cfg(test)]) : appel du routeur Axum sans ouvrir de socket
# réseau (tower::ServiceExt::oneshot), lecture des corps de réponse HTTP, et
# fichiers/dossiers temporaires isolés entre les tests.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
tempfile = "3.14"
