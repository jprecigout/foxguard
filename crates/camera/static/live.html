<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxGuard — Direct</title>

    <!--
      VUE EN DIRECT SEULE, servie par la caméra.

      Pourquoi cette page existe, alors que `controller.html` affiche déjà le
      direct : l'interface du manager (voir `ui/`) donne accès au direct de
      chaque caméra, mais elle est servie par une AUTRE ORIGINE. Elle ne peut
      donc pas ouvrir elle-même le WebSocket de la caméra — et quand bien
      même, il faudrait lui confier le jeton d'API de chaque caméra, c'est-à-
      dire le recopier dans une base puis dans une page web. Ce serait une
      dégradation nette du modèle de sécurité pour afficher une image.

      La caméra sert donc elle-même sa vue en direct, que le manager affiche
      dans un cadre — exactement comme pour les clips (voir
      `clip-player.html`). Le jeton ne quitte jamais la caméra.

      Cette page est volontairement RÉDUITE au direct : pas d'interrupteur, pas
      de capture, pas de suppression. Le manager est en lecture seule, et le
      pilotage d'une caméra reste sur son interface complète.
    -->
    <style>
        :root {
            --bg: #121212;
            --border: #333;
            --text: #e0e0e0;
            --muted: #8a8a8a;
            --accent-red: #e53935;
            --ok: #43a047;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
        }

        img,
        canvas {
            max-width: 100%;
            max-height: 100%;
            display: block;
            background: #000;
        }

        .status {
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 0 16px;
        }

        /* Pastille d'état, reprise de l'interface complète. */
        .badge {
            position: absolute;
            top: 10px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 10px;
            border-radius: 999px;
            background: rgba(0, 0, 0, 0.6);
            color: var(--muted);
            font-size: 0.7rem;
            letter-spacing: 0.04em;
            pointer-events: none;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-red);
        }

        .dot.connected {
            background: var(--ok);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main>
        <p class="status" id="status">Connexion au flux vidéo…</p>
        <canvas id="canvas" hidden></canvas>
        <span class="badge" id="badge" hidden><span class="dot" id="dot"></span><span id="codec"></span></span>
    </main>

    <script>
        // Le jeton est injecté par la caméra au moment de servir la page (voir
        // `live_handler` dans src/api.rs) : il ne transite jamais par le
        // manager, qui n'a aucune raison de le connaître.
        const API_TOKEN = "__FOXGUARD_API_TOKEN__";

        const statusEl = document.getElementById('status');
        const canvas = document.getElementById('canvas');
        const badge = document.getElementById('badge');
        const dot = document.getElementById('dot');
        const codecEl = document.getElementById('codec');

        let socket = null;
        let decoder = null;

        /** Vrai si ce navigateur sait décoder du H.264 lui-même. */
        function supportsWebCodecs() {
            return typeof window.VideoDecoder === 'function'
                && typeof window.EncodedVideoChunk === 'function';
        }

        function show() {
            canvas.hidden = false;
            statusEl.hidden = true;

            codecEl.textContent = 'H.264';
            dot.className = 'dot connected';
            badge.hidden = false;
        }

        function disconnected() {
            statusEl.textContent = 'Reconnexion au flux…';
            statusEl.hidden = false;
            canvas.hidden = true;
            dot.className = 'dot';
        }

        /**
         * Panne définitive : on le DIT.
         *
         * Il n'y a plus de second format sur lequel se rabattre. Un canevas
         * resté vide sans un mot laisserait croire à une caméra en panne
         * alors que c'est le navigateur qui ne sait pas décoder.
         */
        function unavailable(message) {
            statusEl.textContent = message;
            statusEl.hidden = false;
            canvas.hidden = true;
            badge.hidden = true;
        }

        /**
         * Démarre le direct.
         *
         * Le H.264 est le SEUL format que la caméra diffuse : il n'y a plus
         * de capacités à interroger ni de repli à préparer, seulement un
         * prérequis à vérifier.
         */
        function start() {
            if (!supportsWebCodecs()) {
                unavailable(
                    'Ce navigateur ne sait pas décoder le H.264 (WebCodecs indisponible).'
                );
                return;
            }

            connect();
        }

        /** Direct en H.264, décodé par le navigateur (voir `crate::api`). */
        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            socket = new WebSocket(
                `${protocol}//${window.location.host}/ws?token=${API_TOKEN}`
            );
            socket.binaryType = 'arraybuffer';

            const context = canvas.getContext('2d');

            const failed = (reason) => {
                console.error('Flux H.264 interrompu :', reason);

                if (decoder) {
                    try { decoder.close(); } catch (_) { /* déjà fermé */ }
                    decoder = null;
                }

                // La fermeture déclenche `onclose`, donc la reconnexion : un
                // décodeur peut échouer sur un flux momentanément abîmé et
                // repartir sur l'image clé suivante.
                try { socket.close(); } catch (_) { /* déjà fermée */ }
            };

            socket.onmessage = (event) => {
                if (typeof event.data === 'string') {
                    let announcement;

                    try {
                        announcement = JSON.parse(event.data);
                    } catch (err) {
                        failed(err);
                        return;
                    }

                    if (announcement.type !== 'config') return;

                    decoder = new VideoDecoder({
                        output: (frame) => {
                            if (canvas.width !== frame.displayWidth) {
                                canvas.width = frame.displayWidth;
                                canvas.height = frame.displayHeight;
                            }

                            context.drawImage(frame, 0, 0);
                            // Obligatoire : une VideoFrame retient de la
                            // mémoire graphique que le ramasse-miettes ne
                            // libère pas.
                            frame.close();

                            show();
                        },
                        error: failed,
                    });

                    decoder.configure({
                        codec: announcement.codec,
                        optimizeForLatency: true,
                    });

                    return;
                }

                if (!(event.data instanceof ArrayBuffer) || !decoder) return;

                const view = new DataView(event.data);

                try {
                    decoder.decode(new EncodedVideoChunk({
                        type: view.getUint8(0) === 1 ? 'key' : 'delta',
                        timestamp: Number(view.getBigUint64(1)),
                        data: new Uint8Array(event.data, 9),
                    }));
                } catch (err) {
                    failed(err);
                }
            };

            socket.onclose = () => {
                disconnected();

                if (decoder) {
                    try { decoder.close(); } catch (_) { /* déjà fermé */ }
                    decoder = null;
                }

                setTimeout(connect, 2000);
            };

            socket.onerror = () => socket.close();
        }

        start();
    </script>
</body>

</html>
