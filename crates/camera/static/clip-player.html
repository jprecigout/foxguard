<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FoxGuard — Lecture d'un clip</title>

    <!--
      LECTEUR AUTONOME d'un enregistrement FoxGuard.

      Pourquoi cette page existe, alors que l'interface de contrôle
      (controller.html) sait déjà lire les enregistrements :

      La timeline du manager (voir `ui/`) donne accès direct au clip de chaque
      détection. Or ces clips vivent sur la CAMÉRA — ils pèsent plusieurs
      mégaoctets et n'ont aucune raison de traverser le réseau pour finir dans
      une base de données. L'interface du manager, servie par une autre
      origine, ne peut donc pas les lire elle-même : le navigateur le lui
      interdirait (CORS), et ouvrir les enregistrements à toutes les origines
      serait une bien mauvaise façon de contourner ça.

      Elle y donne donc accès en affichant CETTE page, servie par la caméra
      elle-même. La politique de même origine est respectée sans rien
      assouplir, et le format d'enregistrement reste connu du seul composant
      qui l'écrit.

      Les enregistrements sont des MP4 fragmentés contenant du H.264 (voir
      `capture::recording` côté Rust), donc un `<video>` natif suffit : il
      apporte gratuitement le plein écran, le déplacement image par image, le
      réglage de la vitesse et le décodage matériel.

      Cette page ne décode donc plus rien elle-même. Elle l'a fait, du temps
      où les enregistrements étaient dans un format maison — des JPEG
      concaténés qu'aucun navigateur ne savait lire — et c'est l'une des
      raisons d'être passé au MP4.
    -->
    <style>
        :root {
            /* Palette de l'interface embarquée (controller.html) : c'est la
               même caméra, elle n'a pas deux identités visuelles. */
            --bg: #121212;
            --card: #1e1e1e;
            --border: #333;
            --text: #e0e0e0;
            --muted: #8a8a8a;
            --accent: #1e88e5;
            --accent-red: #e53935;
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        header {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--card);
        }

        h1 {
            font-size: 1rem;
            margin: 0;
            flex: 1;
            min-width: 180px;
        }

        h1 .fox {
            color: var(--accent-red);
        }

        .filename {
            color: var(--muted);
            font-size: 0.8rem;
            font-variant-numeric: tabular-nums;
            word-break: break-all;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        video {
            max-width: 100%;
            max-height: 100%;
            background: #000;
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .status {
            color: var(--muted);
            font-size: 0.9rem;
            text-align: center;
            padding: 0 16px;
        }

        .status.error {
            color: var(--accent-red);
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <header>
        <h1>Fox<span class="fox">Guard</span> — clip</h1>
        <span class="filename" id="filename"></span>
    </header>

    <main>
        <p class="status" id="status">Chargement du clip…</p>
        <video id="video" hidden controls autoplay playsinline></video>
    </main>

    <script>
        const statusEl = document.getElementById('status');
        const video = document.getElementById('video');
        const filenameEl = document.getElementById('filename');

        /**
         * Nom du fichier à lire, pris dans le CHEMIN de cette page
         * (`/play/<fichier>`) et non dans un paramètre de requête : c'est la
         * forme que produit la caméra dans ses événements, et elle reste
         * lisible dans la barre d'adresse.
         */
        function clipFilename() {
            const last = window.location.pathname.split('/').filter(Boolean).pop();
            return last ? decodeURIComponent(last) : '';
        }

        // Chaîne de requête d'authentification, injectée par la caméra au
        // moment de servir la page (voir `scoped_page` dans src/api.rs) : un
        // ticket de SESSION limité à ce que fait cette page, jamais le jeton
        // d'API de la caméra (sauf si la page a été ouverte avec lui).
        const AUTH_QUERY = "__FOXGUARD_AUTH_QUERY__";

        /** Affiche un message d'erreur à la place du lecteur. */
        function fail(message) {
            statusEl.textContent = message;
            statusEl.classList.add('error');
            statusEl.hidden = false;
            video.hidden = true;
        }

        function main() {
            const filename = clipFilename();
            filenameEl.textContent = filename;
            document.title = `FoxGuard — ${filename}`;

            if (!filename) {
                fail('Aucun clip demandé.');
                return;
            }

            // Un clip de l'ancien format maison, d'avant le passage au MP4 :
            // plus personne ne sait le décoder. Autant le dire que laisser le
            // <video> échouer sur un message générique.
            if (!filename.toLowerCase().endsWith('.mp4')) {
                fail(
                    'Ce clip est dans l’ancien format d’enregistrement, '
                    + 'qu’aucun lecteur ne sait plus ouvrir.'
                );
                return;
            }

            // La route sert le fichier par PLAGES D'OCTETS (`ServeFile` côté
            // Rust) : c'est ce qui permet au `<video>` de se déplacer dans le
            // clip sans le télécharger en entier.
            //
            // Elle est AUTHENTIFIÉE (voir `recording_handler` côté Rust), par
            // un ticket qui n'ouvre que CE clip.
            video.src = `/recordings/${encodeURIComponent(filename)}?${AUTH_QUERY}`;

            video.addEventListener('loadeddata', () => {
                statusEl.hidden = true;
                video.hidden = false;
            });

            video.addEventListener('error', () => {
                // 404 : le clip a été purgé par la rétention automatique
                // (`[recording] retention_days`), ou n'a jamais existé.
                fail(
                    video.error && video.error.code === MediaError.MEDIA_ERR_NETWORK
                        ? 'Clip injoignable depuis ce navigateur.'
                        : 'Ce clip n’est plus lisible (purgé, ou interrompu avant d’être écrit).'
                );
            });
        }

        main();
    </script>
</body>

</html>
