[package]
name = "foxguard-protocol"
version = "0.1.0"
edition = "2024"
description = "Contrat de messages entre foxguard-camera et foxguard-manager"

# VOLONTAIREMENT MINIMAL.
#
# Ce crate est compilé À LA FOIS sur le Raspberry Pi (dans foxguard-camera) et
# sur le serveur (dans foxguard-manager). Toute dépendance ajoutée ici est
# payée par les deux, et doit compiler en croisé pour ARM64 sous QEMU. On s'en
# tient donc à la sérialisation et aux dates : rien qui touche au réseau, au
# TLS, à l'image ou à l'inférence.
[dependencies]
serde = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
ts-rs = { workspace = true, optional = true }
# Encodage des vignettes de détection, qui voyagent DANS l'événement JSON
# (voir `DetectionEvent::thumbnail`). Admis ici malgré le minimalisme
# revendiqué ci-dessus : c'est de la sérialisation, exactement le périmètre
# de ce crate, et base64 est du Rust pur sans assembleur par architecture.
base64 = { workspace = true }
# Signature des tickets d'accès aux caméras (voir `src/ticket.rs`).
# Admis pour la même raison que base64 : c'est le CONTRAT entre la caméra qui
# vérifie et le manager qui signe, et les deux doivent calculer exactement la
# même chose. Pur Rust, sans assembleur (voir le Cargo.toml du workspace).
hmac = { workspace = true }
sha2 = { workspace = true }
# Comparaison des jetons en temps constant (voir `src/auth.rs`), déjà tiré
# par `hmac`.
subtle = { workspace = true }

[features]
# Génère les définitions TypeScript de ces types (voir `ui/src/generated/`).
#
# OPTIONNELLE : seul `foxguard-manager` l'active. La caméra compile ce crate
# sans elle, et n'embarque donc ni `ts-rs` ni ses macros dans sa compilation
# croisée ARM64 sous QEMU.
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = { workspace = true }
