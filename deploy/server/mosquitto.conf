# Configuration minimale pour un broker de réseau LOCAL.
#
# `allow_anonymous true` convient à un réseau domestique fermé. Dès que le
# broker devient joignable au-delà, activez l'authentification (`password_file`)
# et renseignez username/password dans la configuration des caméras ET du
# manager.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
