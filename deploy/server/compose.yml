# Pile du SERVEUR ANNEXE : manager + broker MQTT.
#
# La caméra, elle, tourne sur le Raspberry Pi avec sa propre image (voir
# deploy/camera/Dockerfile et le README) : elle n'apparaît pas ici.
#
#   docker compose -f deploy/server/compose.yml up -d
#
# Les chemins relatifs sont résolus depuis ce dossier : lancez la commande
# depuis la racine du dépôt avec `-f`, ou ajustez `context`.

services:
  # Base de données des événements de détection. Le manager y applique ses
  # migrations au démarrage : aucune préparation manuelle n'est nécessaire.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: foxguard
      POSTGRES_DB: foxguard
      # Renseignez ce mot de passe dans un fichier `.env` à côté de ce
      # compose (POSTGRES_PASSWORD=...), plutôt qu'en clair ici.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Le manager refuse de démarrer sans base : on attend qu'elle réponde
      # vraiment, et pas seulement que le conteneur soit lancé.
      test: ["CMD-SHELL", "pg_isready -U foxguard -d foxguard"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Broker MQTT partagé : les caméras y publient, le manager y lit.
  #
  # À retirer si vous disposez déjà d'un broker sur le réseau (dans ce cas,
  # renseignez simplement son adresse dans `broker_host` de manager-config.toml).
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data

  manager:
    build:
      context: ../..
      dockerfile: deploy/server/Dockerfile
    image: foxguard-manager:latest
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      # Prend le pas sur `[database] url` du fichier : évite d'écrire le mot
      # de passe dans une configuration montée en lecture seule.
      DATABASE_URL: postgres://foxguard:${POSTGRES_PASSWORD:?mot de passe PostgreSQL requis}@postgres:5432/foxguard
    ports:
      - "8090:8090"
    volumes:
      # Configuration du manager, montée en lecture seule.
      - ../../manager-config.toml:/app/manager-config.toml:ro

volumes:
  mosquitto_data:
  postgres_data:
