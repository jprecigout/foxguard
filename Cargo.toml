[package]
name = "foxguard"
version = "0.1.0"
edition = "2024"

[dependencies]

# Web & Asynchronisme
tokio = { version = "1.38", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["fs"] }
async-stream = "0.3"
bytes = "1.0"
rayon = "1.10"

# Traitement image & V4L2
v4l = "0.14"
image = "0.25"
imageproc = "0.25"
font8x8 = "0.3"

# IA / ONNX Runtime
tract-onnx = "0.23.4"
ndarray = "0.17.2"

# Utilitaire & Alertes
lettre = { version = "0.11", default-features = false, features = [
    "builder",
    "smtp-transport",
    "tokio1-rustls-tls",
] }
chrono = "0.4"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-util = { version = "0.7.19", features = ["io"] }

[profile.release]
opt-level = 3
lto = true        # Link-Time Optimization (optimise le binaire final)
codegen-units = 1 # Permet de meilleures optimisations inter-modules
panic = "abort"   # Enlève la logique d'unwinding des panics
