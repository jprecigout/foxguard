# Workspace FoxGuard.
#
# `foxguard-camera` tourne sur le Raspberry Pi, près de la caméra, avec ses
# dépendances lourdes (V4L2, ONNX, traitement d'image).
#
# Ce workspace prépare l'arrivée des composants qui tourneront sur un serveur
# annexe (voir le README) : le découpage isole dès maintenant ce qui est
# spécifique à la caméra de ce qui sera partagé.
#
# Le `Cargo.lock` sera commun à tous les membres, mais la COMPILATION ne l'est
# pas : `cargo build -p foxguard-camera` ne construit que le sous-graphe de
# dépendances de la caméra. C'est ce qui permettra d'ajouter des composants
# aux dépendances incompatibles avec la compilation croisée ARM64 sous QEMU
# (voir la note sur `ring` dans crates/camera/Cargo.toml) sans jamais les
# construire pour le Raspberry Pi.
[workspace]
resolver = "3"
members = ["crates/camera"]

# Versions partagées par plusieurs crates, déclarées une seule fois pour
# qu'elles ne puissent pas diverger d'un composant à l'autre.
[workspace.dependencies]
anyhow = "1.0"
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `default-features = false` : la connexion au broker n'utilise pas TLS, donc
# on désactive le backend TLS par défaut de rumqttc ("use-rustls") pour éviter
# de tirer `rustls`/`ring` en dépendance (voir la note ci-dessus).
rumqttc = { version = "0.24", default-features = false }

[profile.release]
opt-level = 3
lto = true        # Link-Time Optimization (optimise le binaire final)
codegen-units = 1 # Permet de meilleures optimisations inter-modules
panic = "abort"   # Enlève la logique d'unwinding des panics
