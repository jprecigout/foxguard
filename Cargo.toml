# Workspace FoxGuard.
#
# Trois composants Rust, déployés sur des machines DIFFÉRENTES :
#
# - `foxguard-camera`  : tourne sur le Raspberry Pi, près de la caméra.
#                        Dépendances lourdes (V4L2, ONNX, traitement d'image).
# - `foxguard-manager` : tourne sur un serveur annexe, agrège les événements
#                        de plusieurs caméras. Aucune dépendance caméra.
# - `foxguard-protocol`: le contrat entre les deux — les messages qui
#                        transitent sur MQTT. Aucune dépendance lourde.
#
# Pourquoi un workspace plutôt que trois dépôts : `foxguard-protocol` est le
# format de fil entre la caméra et le manager. Dans des dépôts séparés, le
# manager redéclarerait les structures à la main et rien ne détecterait une
# dérive — ça compilerait des deux côtés et ça casserait silencieusement à
# l'exécution. Ici, casser le contrat est une erreur de COMPILATION.
#
# Le `Cargo.lock` est commun au workspace, mais la COMPILATION ne l'est pas :
# `cargo build -p foxguard-camera` ne construit que le sous-graphe de
# dépendances de la caméra. Les dépendances TLS du manager (rustls/ring et
# leur assembleur par architecture, qui a déjà fait échouer la compilation
# croisée ARM64 sous QEMU — voir crates/camera/Cargo.toml) apparaissent donc
# dans le lock sans jamais être compilées pour le Raspberry Pi.
[workspace]
resolver = "3"
members = ["crates/camera", "crates/manager", "crates/protocol"]

# Versions partagées par plusieurs crates, déclarées une seule fois pour
# qu'elles ne puissent pas diverger d'un composant à l'autre.
[workspace.dependencies]
foxguard-protocol = { path = "crates/protocol" }

anyhow = "1.0"
axum = "0.8.9"
tower-http = { version = "0.7.0", features = ["fs"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
toml = "1.1.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `default-features = false` : la connexion au broker n'utilise pas TLS, donc
# on désactive le backend TLS par défaut de rumqttc ("use-rustls") pour éviter
# de tirer `rustls`/`ring` en dépendance (voir la note ci-dessus).
rumqttc = { version = "0.24", default-features = false }

[profile.release]
opt-level = 3
lto = true        # Link-Time Optimization (optimise le binaire final)
codegen-units = 1 # Permet de meilleures optimisations inter-modules
panic = "abort"   # Enlève la logique d'unwinding des panics
